# Read-only audit of every vendor the site publishes NOTHING for.
#
# db-setup prints this at deploy time, but that log lives inside a Vercel build
# and cannot be read afterwards — so a store that silently publishes nothing
# looks exactly like a store nobody buys from, and 57 of 136 vendor rows were in
# that state at once without any run summary ever looking wrong. Dispatch this
# to ask the production database directly. It writes no rows.
#
# Requires the repository secret DATABASE_URL (same split as refresh-prices.yml:
# if it contains the __PASSWORD__ placeholder, DATABASE_PASSWORD must be set
# too). Without DATABASE_URL the job exits cleanly doing nothing.
name: Vendor publishing audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit vendors that publish nothing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: npm run audit:publishing
