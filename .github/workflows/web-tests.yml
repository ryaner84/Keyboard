# The site's test gate. Until this existed, NOTHING ran the five ts-node
# suites, `tsc --noEmit` or `next lint` automatically — scraper-tests.yml
# covers only Python, and only when scraper/** changes. Vercel's build
# typechecks, but it runs after merge on main and catches no unit test.
#
# `next build` is deliberately NOT run here: without a database it stops at
# "Collecting page data" with `No database configuration found`, which is
# environmental rather than a code fault (see CLAUDE.md). `tsc --noEmit`
# already covers what the build would tell us at this stage.
name: Web checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma's generated client lives in src/generated/prisma and is imported
      # by the type layer, so it has to exist before tsc runs.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      # Run every suite even if an earlier one fails, so one broken suite
      # doesn't hide the state of the other four.
      - name: kit-variants
        if: always()
        run: npm run test:kit-variants

      - name: kit-filters
        if: always()
        run: npm run test:kit-filters

      - name: set-name
        if: always()
        run: npm run test:set-name

      - name: csv-import
        if: always()
        run: npm run test:csv-import

      # The rate feed decides every converted figure on the site — spend, P/L,
      # and which vendor is cheapest across currencies. A payload parsed out of
      # an error page would be written over the only copy we have.
      - name: currency-rates
        if: always()
        run: npm run test:currency-rates

      # Reads both tracker route files: a field the editor can WRITE but the
      # list endpoint does not RETURN is not merely hidden — the editor seeds
      # itself from that payload, so the next save writes a blank over it.
      - name: collection-roundtrip
        if: always()
        run: npm run test:collection-roundtrip

      - name: collection-import
        if: always()
        run: npm run test:collection-import

      - name: keycap-collection
        if: always()
        run: npm run test:keycap-collection

      - name: collection-sales
        if: always()
        run: npm run test:collection-sales

      - name: http-json
        if: always()
        run: npm run test:http-json

      - name: home-cache
        if: always()
        run: npm run test:home-cache

      # Plain node, not ts-node: the helper it covers is imported by
      # scripts/db-setup.mjs, which runs in the build before any TS exists.
      - name: vendor-urls
        if: always()
        run: npm run test:vendor-urls

      # Also plain node — the identity rule it covers decides which GroupBuy
      # rows db-setup DELETES, so it runs in the build alongside vendor-urls.
      - name: set-merge
        if: always()
        run: npm run test:set-merge

      # Reads scrape.py too: the price pass is written twice and only the TS
      # half can import the shared module, so the Python mirror is checked here.
      - name: link-health
        if: always()
        run: npm run test:link-health

      # Also reads scrape.py: "sold out" vs "this feed does not report stock"
      # is written twice, and collapsing them would hide live listings.
      - name: catalog-stock
        if: always()
        run: npm run test:catalog-stock

      # Also reads scrape.py, discovery.ts and prices.ts: /products.json and
      # /products/<handle>.json are not Shopify's alone, and reading only
      # Shopify's field names returns a full catalogue that matches nothing —
      # silently, and in both halves of discovery and both price passes.
      - name: storefront-catalog
        if: always()
        run: npm run test:storefront-catalog

      # Reads scrape.py and prices.ts: a Tilda Store draws its catalogue in the
      # browser, so the page carries no markup either price pass can read and
      # the shared rules — the block parameters, the root-zone hop, the
      # three-answer stock field — are the only thing standing between a live
      # shop and an unpriced (therefore hidden) listing.
      - name: tilda-store
        if: always()
        run: npm run test:tilda-store

      # Reads scrape.py, prices.ts and db-setup.mjs: the base-kit price window
      # decides what the site is willing to publish, and drift between the
      # producers and the deploy purge is silent both ways — too low a ceiling
      # hides a live listing, too low a purge wipes a stored price nightly.
      - name: kit-bounds
        if: always()
        run: npm run test:kit-bounds

      # Reads prices.ts, scrape.py, db-setup.mjs and prisma/seed.ts: the list of
      # currencies the site can price in was written in all five of them, and a
      # code missing from it is not a degraded price but NO price — refused,
      # unpriced, and hidden outright on a released set. IDR was missing from
      # every copy, so mechaland.id published nothing at all.
      - name: currencies
        if: always()
        run: npm run test:currencies

      # `npm run build` is `prisma generate && node scripts/db-setup.mjs &&
      # next build`, so a db-setup.mjs that cannot be PARSED fails the deploy
      # before next build is reached — and nothing here could see it: a dozen
      # suites read that file as text, none imports it, tsc only includes
      # **/*.ts and next lint does not reach scripts/. One shipped on 2026-09-15
      # with all 19 suites, the typecheck and the lint green.
      - name: scripts-syntax
        if: always()
        run: npm run test:scripts-syntax

      # Reads scrape.py and prices.ts: the per-host request spacing is written
      # twice, and for a long time only the nightly had it. An unthrottled,
      # host-clustered queue invites the 429 that reads as UNREADABLE — which
      # backs a row off for a fortnight and hides it on every released set.
      - name: host-throttle
        if: always()
        run: npm run test:host-throttle

      # Reads prices.ts and the probe: completing a storefront's certificate
      # chain is the one place this codebase touches TLS verification, so the
      # suite pins that it is never loosened — a fetched intermediate becomes a
      # trust anchor, and one accepted without checking it against the real root
      # store would be a far worse bug than the unread listing it repairs.
      - name: tls-chain
        if: always()
        run: npm run test:tls-chain

      # Reads scrape.py as well as the TS sources: the manufacturer registry is
      # written in both languages and a divergence is silent at runtime.
      - name: manufacturer-vendors
        if: always()
        run: npm run test:manufacturer-vendors

      # A storefront's own TEST product is shaped exactly like a real listing,
      # so only a name rule can refuse it — and that rule is written twice (the
      # import that stops it being written, the db-setup purge that clears what
      # already was). A divergence is silent at runtime.
      - name: keyboard-vendors
        if: always()
        run: npm run test:keyboard-vendors
