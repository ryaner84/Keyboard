# Nightly vendor linking: discovery (crawl store catalogs, attach listings to
# tracked sets) followed by outlets (relink to in-stock / clearance listings).
#
# This is the pass that decides WHICH page each vendor row points at, and until
# now nothing ran it on a schedule — it only happened when the owner ran the
# full scraper by hand. Everything downstream inherits its choices: a set
# pinned to a dead group-buy page reports "sold out" forever no matter how
# often prices refresh.
#
# It does not price anything itself. Both passes clear priceUpdatedAt on the
# rows they relink, and refresh-prices.yml (every 6h) picks those up — so a
# relink is live within hours without this job holding a browser open for them.
#
# Discovery rotates a fixed number of vendors per run, so daily gives the full
# roster a complete cycle every few days. Re-running is always safe.
name: Scraper vendor links

on:
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: Maximum run time
        required: false
        type: string
        default: "45"
  schedule:
    # 02:30 UTC, ahead of the 03:40 health check so the health run reports on
    # the state this job just left behind.
    - cron: "30 2 * * *"

concurrency:
  # Shared with scraper-health: both drive a browser against the same stores.
  group: scraper-vendor-io
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Discovery + outlets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: >-
          python scraper/scrape.py
          --links-only
          --budget-minutes ${{ github.event_name == 'workflow_dispatch' && inputs.budget_minutes || '45' }}
          --headless
          --no-scrapling

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-links-${{ github.run_id }}
          path: scraper/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
