# TEMPORARY diagnostic workflow — removed before this branch is proposed.
name: zf scratch probe

on:
  push:
    branches: [claude/compassionate-dijkstra-kzsddh]
    paths: ["scripts/zf-scratch-probe.mjs", ".github/workflows/zf-scratch-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: node scripts/zf-scratch-probe.mjs
