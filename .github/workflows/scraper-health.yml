# Daily read-only assertion that the scraper's inputs still exist.
#
# Every coverage bug found so far failed silently: a vendor whose stored origin
# 404s and a collection that returns 200 with zero products both produce a run
# summary identical to "there was nothing to do". This job is the only thing
# that can tell those apart, because it asserts rather than infers.
#
# Known catches (both found by hand before this existed):
#   yushakobo.jp/products.json                        -> 404, store is on shop.
#   geon.works/collections/gmk-leftover-collection    -> 200 with 0 products
#
# RED means actionable: a dead origin or an empty collection. A blocked fetch
# (403/429/timeout) is logged but never fails the job — that is rate limiting,
# and failing on it would train everyone to ignore this.
name: Scraper health

on:
  workflow_dispatch:
  schedule:
    # 03:40 UTC — after the nightly linking pass, and off the hour because
    # GitHub's scheduler is heavily contended on round numbers.
    - cron: "40 3 * * *"

concurrency:
  # Shared with the linking job: both drive a browser against the same stores,
  # and running them together is how you get rate-limited by your own tooling.
  group: scraper-vendor-io
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Probe every vendor origin and outlet collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: >-
          python scraper/scrape.py
          --health-only
          --budget-minutes 20
          --headless
          --no-scrapling

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-health-${{ github.run_id }}
          path: scraper/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
