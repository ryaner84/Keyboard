# TEMPORARY diagnostic — runs only on this working branch while tracing a
# silent vendor, and is removed before the branch is proposed. Read-only: it
# SELECTs VendorKit rows for the named vendors and asks fetchVendorPrice what
# each URL answers from a runner IP. Writes nothing.
name: Tmp vendor row diagnose

on:
  push:
    branches:
      - claude/compassionate-dijkstra-4bhv1p
    paths:
      - "scripts/tmp-vendor-row-diagnose.mjs"
      - ".github/workflows/tmp-vendor-row-diagnose.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Diagnose vendor rows (read-only)
        env:
          DATABASE_URL: postgresql://diag:diag@127.0.0.1:5432/diag
          DIAG_URLS: "https://www.primekb.com/products/gmk-inukuma https://keygem.com/products/gmk-delta-r2-group-buy https://cannonkeys.com/products/gmk-dolch"
        run: npx tsx scripts/tmp-vendor-row-diagnose.mjs
